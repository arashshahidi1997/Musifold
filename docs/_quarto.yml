project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"
  resources:
    - assets/**

website:
  title: Musifold
  draft-mode: unlinked
  description: Interactive music theory. Sound, tuning, scales and harmony as geometry you can see, hear and play.
  favicon: assets/favicon.svg
  open-graph: true
  site-url: https://arashshahidi1997.github.io/Musifold/
  repo-url: https://github.com/arashshahidi1997/Musifold
  repo-actions: [source, issue]
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: tutorials/fundamentals/fundamentals.qmd
        text: Fundamentals
    right:
      - icon: github
        href: https://github.com/arashshahidi1997/Musifold
        aria-label: Musifold on GitHub
  page-footer:
    center: "Musifold · interactive music theory"
  sidebar:
    style: docked
    contents:
      - href: index.qmd
        text: Home
      - section: Tutorials
        contents:
          - tutorials/fundamentals/fundamentals.qmd
          - section: Guitar Harmony
            contents:
              - tutorials/guitar-harmony/map.qmd
              - tutorials/guitar-harmony/space.qmd
              - tutorials/guitar-harmony/hold-step.qmd
              - tutorials/guitar-harmony/fifth-motion.qmd
              - tutorials/guitar-harmony/symmetry.qmd
              - tutorials/guitar-harmony/parallel.qmd

format:
  html:
    theme: cosmo
    toc: true
